spring:
  application:
    name: pipegate

  datasource:
    url: jdbc:postgresql://localhost:5432/pipegate_db
    username: postgres
    password: YOUR_POSTGRES_PASSWORD

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: YOUR_MAILTRAP_USERNAME
    password: YOUR_MAILTRAP_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

pipegate:
  otp:
    expiry-minutes: 10
  api-key:
    prefix-sandbox: pk_sandbox_
    prefix-live: pk_live_
  secret-key:
    prefix-sandbox: sk_sandbox_
    prefix-live: sk_live_